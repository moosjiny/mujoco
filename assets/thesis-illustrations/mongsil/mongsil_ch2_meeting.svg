<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f6b"/>
      <stop offset="45%" stop-color="#5a5a8a"/>
      <stop offset="75%" stop-color="#8a6f8f"/>
      <stop offset="100%" stop-color="#c98f7a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4560"/>
      <stop offset="100%" stop-color="#2e2a42"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dusk)"/>
  <rect y="430" width="800" height="170" fill="url(#ground)"/>

  <!-- faint alley walls -->
  <rect x="0" y="60" width="180" height="380" fill="#2a2740" opacity="0.55"/>
  <rect x="640" y="20" width="160" height="420" fill="#2a2740" opacity="0.55"/>

  <!-- warm glow between the two figures -->
  <ellipse cx="400" cy="470" rx="260" ry="140" fill="url(#glow)"/>

  <!-- wooden box, bottom-left -->
  <g transform="translate(150,410)">
    <polygon points="0,110 20,60 170,50 190,100" fill="#7a5a3c"/>
    <polygon points="0,110 190,100 190,120 0,130" fill="#5e4630"/>
    <line x1="10" y1="72" x2="180" y2="63" stroke="#5e4630" stroke-width="3"/>
    <line x1="6" y1="92" x2="185" y2="82" stroke="#5e4630" stroke-width="3"/>
    <!-- box inner shadow -->
    <polygon points="20,60 170,50 165,75 25,84" fill="#241f33"/>
  </g>

  <!-- Mongsil the puppy peeking out, ears up, one paw on the edge -->
  <g transform="translate(205,378)">
    <ellipse cx="30" cy="55" rx="34" ry="26" fill="#faf6ef"/>
    <circle cx="18" cy="20" r="24" fill="#faf6ef"/>
    <polygon points="0,4 10,-16 20,6" fill="#f1e6d3"/>
    <polygon points="18,2 26,-18 36,4" fill="#f1e6d3"/>
    <circle cx="10" cy="18" r="2.6" fill="#3a2f2a"/>
    <circle cx="24" cy="17" r="2.6" fill="#3a2f2a"/>
    <ellipse cx="17" cy="27" rx="3.5" ry="2.5" fill="#e2b8a0"/>
    <path d="M10,32 Q17,37 24,31" stroke="#c9a084" stroke-width="1.6" fill="none"/>
    <!-- small paw resting on box edge -->
    <ellipse cx="52" cy="70" rx="9" ry="6" fill="#faf6ef"/>
  </g>

  <!-- girl crouching, reaching a hand out -->
  <g transform="translate(430,330)">
    <!-- hair -->
    <path d="M40,10 C10,10 0,55 6,110 C10,150 20,175 20,175 L60,175 C60,175 66,140 68,105 C72,55 70,10 40,10 Z" fill="#241f26"/>
    <!-- face -->
    <ellipse cx="38" cy="55" rx="20" ry="22" fill="#f2d9c4"/>
    <!-- jacket / crouched body -->
    <path d="M18,95 Q10,150 30,190 L70,190 Q85,150 62,95 Z" fill="#4c7a53"/>
    <!-- knees (crouch) -->
    <ellipse cx="24" cy="188" rx="14" ry="10" fill="#4c7a53"/>
    <ellipse cx="66" cy="188" rx="14" ry="10" fill="#4c7a53"/>
    <!-- extended arm & hand reaching toward the box -->
    <path d="M20,110 Q-40,120 -75,138" stroke="#f2d9c4" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="-80" cy="140" r="10" fill="#f2d9c4"/>
  </g>

  <!-- crescent moon, small -->
  <g transform="translate(680,70)">
    <path d="M20,0 A20,20 0 1 0 20,40 A15,15 0 1 1 20,0 Z" fill="#fff3d6" opacity="0.9"/>
  </g>
  <circle cx="120" cy="50" r="2" fill="#fff3d6" opacity="0.8"/>
  <circle cx="600" cy="90" r="1.6" fill="#fff3d6" opacity="0.7"/>
  <circle cx="740" cy="150" r="1.8" fill="#fff3d6" opacity="0.7"/>

  <text x="400" y="580" font-family="Georgia, serif" font-size="20" fill="#f5e9d8" text-anchor="middle" opacity="0.85">발소리 하나가 멈추다</text>
</svg>
