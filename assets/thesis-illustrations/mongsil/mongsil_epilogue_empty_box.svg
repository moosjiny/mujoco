<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1030"/>
      <stop offset="55%" stop-color="#1c2350"/>
      <stop offset="100%" stop-color="#33305a"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232048"/>
      <stop offset="100%" stop-color="#14122e"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dfe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="memoryglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#night)"/>
  <rect y="440" width="800" height="160" fill="url(#ground2)"/>

  <!-- alley walls -->
  <rect x="0" y="40" width="170" height="400" fill="#191536" opacity="0.6"/>
  <rect x="650" y="10" width="150" height="430" fill="#191536" opacity="0.6"/>

  <!-- crescent moon -->
  <g transform="translate(600,80)">
    <circle cx="40" cy="40" r="90" fill="url(#moonglow)"/>
    <path d="M40,0 A40,40 0 1 0 40,80 A28,28 0 1 1 40,0 Z" fill="#f5f1e2"/>
  </g>

  <!-- stars -->
  <circle cx="90" cy="70" r="2.2" fill="#f5f1e2" opacity="0.9"/>
  <circle cx="160" cy="120" r="1.6" fill="#f5f1e2" opacity="0.75"/>
  <circle cx="260" cy="60" r="1.8" fill="#f5f1e2" opacity="0.8"/>
  <circle cx="480" cy="100" r="1.5" fill="#f5f1e2" opacity="0.7"/>
  <circle cx="330" cy="150" r="1.3" fill="#f5f1e2" opacity="0.6"/>

  <!-- bare tree branches reaching over, echoing the story's night window -->
  <g stroke="#0c0a20" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M700,600 C690,480 650,420 600,380"/>
    <path d="M650,420 C620,400 590,395 560,410"/>
    <path d="M630,450 C610,440 595,445 580,460"/>
  </g>

  <!-- the empty wooden box, alone -->
  <g transform="translate(300,420)">
    <polygon points="0,110 20,60 170,50 190,100" fill="#4a3826"/>
    <polygon points="0,110 190,100 190,120 0,130" fill="#382a1c"/>
    <line x1="10" y1="72" x2="180" y2="63" stroke="#382a1c" stroke-width="3"/>
    <line x1="6" y1="92" x2="185" y2="82" stroke="#382a1c" stroke-width="3"/>
    <!-- empty dark interior -->
    <polygon points="20,60 170,50 165,75 25,84" fill="#0f0c1a"/>
  </g>

  <!-- soft warm memory-glow drifting above the box, faint puppy silhouette -->
  <g transform="translate(345,340)" opacity="0.55">
    <ellipse cx="60" cy="70" rx="90" ry="60" fill="url(#memoryglow)"/>
    <ellipse cx="60" cy="80" rx="26" ry="20" fill="#fff6df" opacity="0.35"/>
    <circle cx="46" cy="52" r="18" fill="#fff6df" opacity="0.35"/>
    <polygon points="32,38 40,20 48,40" fill="#fff6df" opacity="0.3"/>
    <polygon points="46,38 52,18 60,38" fill="#fff6df" opacity="0.3"/>
  </g>

  <!-- fallen leaves settling near the box -->
  <g fill="#6b5a3c" opacity="0.7">
    <ellipse cx="270" cy="560" rx="10" ry="5" transform="rotate(20 270 560)"/>
    <ellipse cx="470" cy="570" rx="9" ry="5" transform="rotate(-15 470 570)"/>
    <ellipse cx="520" cy="545" rx="8" ry="4" transform="rotate(35 520 545)"/>
  </g>

  <text x="400" y="580" font-family="Georgia, serif" font-size="20" fill="#dfe1f5" text-anchor="middle" opacity="0.85">상자가 사라진 밤</text>
</svg>
