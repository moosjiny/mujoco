name: Hermes Bridge

on:
  push:
    paths:
      - '.hermes-trigger'

permissions:
  contents: write
  issues: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read trigger file
        id: trigger
        run: |
          TOTP=$(python3 -c "import json; d=json.load(open('.hermes-trigger')); print(d.get('code',''))")
          TOKEN=$(python3 -c "import json; d=json.load(open('.hermes-trigger')); print(d.get('token',''))")
          ACTION=$(python3 -c "import json; d=json.load(open('.hermes-trigger')); print(d.get('action','auth'))")
          SEND_TO=$(python3 -c "import json; d=json.load(open('.hermes-trigger')); print(d.get('to','broadcast'))")
          SEND_SUBJECT=$(python3 -c "import json; d=json.load(open('.hermes-trigger')); print(d.get('subject',''))")
          SEND_BODY=$(python3 -c "import json; d=json.load(open('.hermes-trigger')); print(d.get('body',''))")
          echo "totp=$TOTP" >> $GITHUB_OUTPUT
          echo "pretoken=$TOKEN" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "send_to=$SEND_TO" >> $GITHUB_OUTPUT
          echo "send_subject=$SEND_SUBJECT" >> $GITHUB_OUTPUT
          echo "send_body=$SEND_BODY" >> $GITHUB_OUTPUT

      - name: TOTP Auth
        id: auth
        run: |
          PRETOKEN="${{ steps.trigger.outputs.pretoken }}"
          if [ -n "$PRETOKEN" ]; then
            echo "Using pre-existing token"
            echo "token=$PRETOKEN" >> $GITHUB_OUTPUT
            echo "http_status=cached" >> $GITHUB_OUTPUT
            {
              echo "body<<EOF"
              echo "{\"token\":\"$PRETOKEN\",\"source\":\"cached\"}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            RESP=$(curl -s -X POST "https://ec2.hyperbook.com/hermes/totp" \
              -H "Content-Type: application/json" \
              -d "{\"code\": \"${{ steps.trigger.outputs.totp }}\"}" \
              -w "\n__STATUS__%{http_code}")
            HTTP_STATUS=$(echo "$RESP" | tail -1 | sed 's/.*__STATUS__//')
            BODY=$(echo "$RESP" | head -1)
            echo "HTTP: $HTTP_STATUS"
            echo "Body: $BODY"
            TOKEN=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('token',''))" 2>/dev/null || echo "")
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
            echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
            {
              echo "body<<EOF"
              echo "$BODY"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Fetch events
        if: steps.trigger.outputs.action == 'events'
        id: events
        run: |
          TOKEN="${{ steps.auth.outputs.token }}"
          if [ -z "$TOKEN" ]; then echo "No token"; exit 0; fi
          EVENTS=$(curl -s "https://ec2.hyperbook.com/hermes/events" \
            -H "Authorization: Bearer $TOKEN" \
            --max-time 15 2>&1 || true)
          echo "Events output:"
          echo "$EVENTS"
          {
            echo "data<<EVEOF"
            echo "$EVENTS"
            echo "EVEOF"
          } >> $GITHUB_OUTPUT

      - name: Send message
        if: steps.trigger.outputs.action == 'send'
        id: send
        run: |
          TOKEN="${{ steps.auth.outputs.token }}"
          if [ -z "$TOKEN" ]; then echo "No token"; exit 0; fi
          RESP=$(curl -s -X POST "https://ec2.hyperbook.com/hermes/send" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\": \"${{ steps.trigger.outputs.send_to }}\", \"subject\": \"${{ steps.trigger.outputs.send_subject }}\", \"body\": \"${{ steps.trigger.outputs.send_body }}\"}")
          echo "Send response: $RESP"
          {
            echo "resp<<SENDEOF"
            echo "$RESP"
            echo "SENDEOF"
          } >> $GITHUB_OUTPUT

      - name: Post result as issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const authStatus = `${{ steps.auth.outputs.http_status }}`;
            const authBody = `${{ steps.auth.outputs.body }}`;
            const token = `${{ steps.auth.outputs.token }}`;
            const events = `${{ steps.events.outputs.data }}`;
            const sendResp = `${{ steps.send.outputs.resp }}`;
            const action = `${{ steps.trigger.outputs.action }}`;
            const ts = new Date().toISOString();

            const body = [
              `## Hermes Bridge Result`,
              `**Timestamp:** ${ts}`,
              `**Action:** ${action}`,
              `**Auth HTTP:** ${authStatus}`,
              `**Auth Body:** \`${authBody}\``,
              `**Token:** \`${token}\``,
              events ? `### Events\n\`\`\`\n${events}\n\`\`\`` : '',
              sendResp ? `### Send Response\n\`\`\`\n${sendResp}\n\`\`\`` : '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[hermes-result] ${ts}`,
              body: body,
              labels: ['hermes-result']
            });
